# CI pipeline for the Supabase Edge Functions backend (Deno/TypeScript).
#
# Single-project decision (01-RESEARCH.md Wave 0 Gaps): this MVP uses the one
# free-tier Supabase project for both this workflow's DATABASE_URL secret
# (smoke-test) and production (deploy job) - there is no separate staging
# project, consistent with the free-tier-only cost constraint from CLAUDE.md.
name: CI

on: [push, pull_request]

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: DB connectivity smoke test (real Supabase Transaction Pooler)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: deno run --allow-net --allow-env scripts/smoke-test-db.ts

  deploy:
    needs: smoke-test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Link Supabase project
        run: supabase link --project-ref ${{ secrets.SUPABASE_PROJECT_ID }}
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      - name: Push database migrations
        run: supabase db push
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      - name: Deploy Edge Functions
        run: supabase functions deploy
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Run Deno test suite (post-deploy, proves SC-1/SC-3/SC-4)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_ID }}
        run: deno test --allow-net --allow-env tests/
